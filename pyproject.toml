[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phdseydi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openturns>=1.23",
    "scipy>=1.11.4",
    "numpy>=1.26.4",
    "pandas",
    "matplotlib",
    "seaborn",
    "shapely",
    "scikit-learn",
    "polyagamma",
    "arviz",
    "properscoring",
]

[tool.uv.sources]
phebus = { path = "./phebus", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["Code Gibbs GPETAS", "spatial_density_estimation*", "SPIN_Hawkes*"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
